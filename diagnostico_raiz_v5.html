<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico R.A.I.Z · Dra. Luana Rodrigues</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --preto: #16130F;
  --cobre: #C4763A;
  --cobre-esc: #A05E28;
  --cobre-claro: #D98A4E;
  --creme: #F0E4CC;
  --cinza: #8C8880;
  --bege: #9C7B5E;
  --offwhite: #FAF7F2;
  --texto: #3a3028;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Outfit', sans-serif; background: var(--preto); color: var(--creme); min-height: 100vh; }

/* ── TELA SELEÇÃO ── */
#tela-selecao {
  max-width: 680px;
  margin: 0 auto;
  padding: 56px 40px;
}
.logo-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 48px;
}
.logo-dot { width: 8px; height: 8px; background: var(--cobre); border-radius: 50%; }
.logo-txt { font-size: 10px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--cobre); }

.sel-titulo {
  font-size: 40px; font-weight: 800; line-height: 1.1; margin-bottom: 8px;
}
.sel-titulo span { color: var(--cobre); }
.sel-sub {
  font-family: 'Lora', serif; font-style: italic; font-size: 15px;
  color: var(--cinza); margin-bottom: 40px; line-height: 1.7;
}

.campo-label {
  font-size: 10px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
  color: var(--cobre); margin-bottom: 10px;
}
.campo-busca {
  position: relative; margin-bottom: 16px;
}
.campo-busca input {
  width: 100%;
  background: rgba(196,118,58,0.06);
  border: 1px solid rgba(196,118,58,0.2);
  border-radius: 4px;
  padding: 14px 18px;
  font-family: 'Outfit', sans-serif;
  font-size: 15px; font-weight: 400;
  color: var(--creme);
  outline: none;
  transition: border-color 0.2s;
}
.campo-busca input::placeholder { color: rgba(240,228,204,0.25); }
.campo-busca input:focus { border-color: var(--cobre); background: rgba(196,118,58,0.09); }

.lista-leads {
  background: rgba(196,118,58,0.05);
  border: 1px solid rgba(196,118,58,0.15);
  border-radius: 4px;
  max-height: 280px;
  overflow-y: auto;
  display: none;
}
.lead-item {
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 1px solid rgba(196,118,58,0.08);
  transition: background 0.15s;
}
.lead-item:last-child { border-bottom: none; }
.lead-item:hover { background: rgba(196,118,58,0.1); }
.lead-item-nome { font-size: 14px; font-weight: 600; color: var(--creme); }
.lead-item-detalhe { font-size: 12px; color: var(--cinza); margin-top: 2px; }
.lead-item-score {
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
  padding: 3px 10px; border-radius: 40px; float: right; margin-top: 2px;
}
.score-quente { background: rgba(196,118,58,0.2); color: var(--cobre); }
.score-morna  { background: rgba(156,123,94,0.2); color: var(--bege); }
.score-fria   { background: rgba(140,136,128,0.15); color: var(--cinza); }

.lead-selecionada-card {
  display: none;
  background: rgba(196,118,58,0.08);
  border: 1px solid rgba(196,118,58,0.3);
  border-radius: 4px;
  padding: 16px 20px;
  margin-bottom: 24px;
  align-items: center;
  justify-content: space-between;
}
.lsc-nome { font-size: 16px; font-weight: 700; color: var(--creme); }
.lsc-detalhe { font-size: 12px; color: var(--cinza); margin-top: 3px; }
.lsc-trocar {
  font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: var(--cinza); background: none; border: none; cursor: pointer;
  text-decoration: underline;
}
.lsc-trocar:hover { color: var(--cobre); }

.btn-gerar {
  width: 100%; background: var(--cobre); color: var(--creme);
  border: none; border-radius: 4px; padding: 16px 32px;
  font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; transition: background 0.2s; margin-top: 8px;
  display: none;
}
.btn-gerar:hover { background: var(--cobre-esc); }

.btn-carregar {
  background: transparent; border: 1px solid rgba(196,118,58,0.3);
  border-radius: 4px; padding: 12px 24px;
  font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--cobre); cursor: pointer; transition: all 0.2s;
  width: 100%; margin-bottom: 20px;
}
.btn-carregar:hover { border-color: var(--cobre); background: rgba(196,118,58,0.06); }

.status-txt {
  font-size: 12px; color: var(--cinza); text-align: center;
  margin-top: 12px; min-height: 18px;
  font-family: 'Lora', serif; font-style: italic;
}

/* ── TELA LOADING ── */
#tela-loading {
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; text-align: center; padding: 48px;
}
.spinner {
  width: 44px; height: 44px;
  border: 2px solid rgba(196,118,58,0.2);
  border-top-color: var(--cobre);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin-bottom: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-nome { font-size: 22px; font-weight: 700; color: var(--creme); margin-bottom: 8px; }
.loading-msg { font-family: 'Lora', serif; font-style: italic; font-size: 14px; color: var(--cinza); }

/* ── TELA DIAGNÓSTICO ── */
#tela-diagnostico {
  display: none;
  background: var(--offwhite);
  color: var(--texto);
  min-height: 100vh;
}
.diag-header {
  background: var(--preto);
  padding: 24px 48px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.diag-header-esq { display: flex; align-items: center; gap: 14px; }
.diag-badge {
  font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  color: var(--creme); background: var(--cobre); padding: 5px 12px; border-radius: 40px;
}
.diag-nome-header { font-size: 15px; font-weight: 700; color: var(--creme); }
.diag-prof-header { font-size: 12px; color: var(--cinza); margin-top: 2px; }
.btn-nova {
  background: transparent; border: 1px solid rgba(240,228,204,0.2);
  border-radius: 4px; padding: 8px 18px;
  font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(240,228,204,0.5); cursor: pointer; transition: all 0.2s;
}
.btn-nova:hover { border-color: var(--cobre); color: var(--cobre); }
.btn-imprimir {
  background: var(--cobre); border: none; border-radius: 4px;
  padding: 8px 18px; font-family: 'Outfit', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--creme); cursor: pointer; margin-left: 8px;
}

.diag-body { max-width: 900px; margin: 0 auto; padding: 48px 40px 80px; }

.abertura-bloco {
  margin-bottom: 40px;
  padding-bottom: 40px;
  border-bottom: 1px solid rgba(22,19,15,0.1);
}
.overline {
  font-size: 10px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
  color: var(--cobre); margin-bottom: 10px;
}
.titulo-lead { font-size: 36px; font-weight: 800; color: var(--preto); line-height: 1.1; }
.subtitulo-lead { font-size: 13px; color: var(--cinza); margin-top: 6px; font-family: 'Lora', serif; font-style: italic; }

.frase-abertura {
  font-family: 'Lora', serif; font-style: italic; font-size: 16px;
  color: var(--bege); line-height: 1.8;
  border-left: 3px solid var(--cobre);
  padding: 18px 24px; margin-top: 20px;
  background: rgba(196,118,58,0.05);
  border-radius: 0 4px 4px 0;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid-full { margin-bottom: 20px; }

.card {
  background: white; border-radius: 8px; padding: 24px;
  border: 1px solid rgba(22,19,15,0.07);
}
.card-label {
  font-size: 10px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
  color: var(--cobre); margin-bottom: 14px;
}
.card-texto {
  font-family: 'Lora', serif; font-size: 14px; color: var(--texto); line-height: 1.8;
}

.eixo-item {
  display: flex; align-items: flex-start; gap: 12px;
  margin-bottom: 14px; padding-bottom: 14px;
  border-bottom: 1px solid rgba(22,19,15,0.06);
}
.eixo-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.eixo-num {
  width: 28px; height: 28px; min-width: 28px;
  background: var(--cobre); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: var(--creme);
}
.eixo-nome { font-size: 13px; font-weight: 700; color: var(--preto); margin-bottom: 3px; }
.eixo-desc { font-family: 'Lora', serif; font-size: 13px; color: var(--bege); line-height: 1.6; }

.mov-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; margin-bottom: 10px;
  background: var(--offwhite); border-radius: 4px;
  border-left: 3px solid var(--cobre);
}
.mov-num {
  font-size: 10px; font-weight: 800; color: var(--cobre);
  background: rgba(196,118,58,0.1);
  padding: 3px 8px; border-radius: 4px; min-width: 28px; text-align: center;
}
.mov-texto { font-size: 13px; font-weight: 600; color: var(--preto); line-height: 1.5; }

.transicao-bloco {
  background: rgba(196,118,58,0.07);
  border: 1px solid rgba(196,118,58,0.2);
  border-radius: 4px; padding: 18px 22px; margin-top: 14px;
}
.transicao-texto {
  font-family: 'Lora', serif; font-style: italic;
  font-size: 15px; color: var(--bege); line-height: 1.7;
}

.score-wrap { display: flex; align-items: center; gap: 14px; margin: 10px 0; }
.score-track { flex: 1; height: 7px; background: rgba(22,19,15,0.08); border-radius: 40px; overflow: hidden; }
.score-fill { height: 100%; background: var(--cobre); border-radius: 40px; transition: width 1s ease; }
.score-num { font-size: 26px; font-weight: 800; color: var(--cobre); }
.score-legenda { font-family: 'Lora', serif; font-style: italic; font-size: 13px; color: var(--cinza); margin-top: 6px; }
.score-pill {
  display: inline-block; margin-top: 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 5px 14px; border-radius: 40px;
}

.obj-tag { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cobre); margin-bottom: 8px; }
.obj-frase { font-size: 14px; font-weight: 700; color: var(--preto); margin-bottom: 8px; }
.obj-quebra { font-family: 'Lora', serif; font-style: italic; font-size: 13px; color: var(--bege); line-height: 1.7; }

.rodape {
  margin-top: 48px; padding-top: 28px;
  border-top: 1px solid rgba(22,19,15,0.08);
  display: flex; align-items: center; justify-content: space-between;
}
.rodape-marca { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--cinza); }
.rodape-marca span { color: var(--cobre); }
.rodape-data { font-family: 'Lora', serif; font-style: italic; font-size: 11px; color: var(--cinza); }

@media print {
  .diag-header .btn-nova, .diag-header .btn-imprimir { display: none; }
  #tela-selecao, #tela-loading { display: none !important; }
  #tela-diagnostico { display: block !important; }
  body { background: white; }
}
@media (max-width: 600px) {
  #tela-selecao { padding: 36px 20px; }
  .diag-header { padding: 16px 20px; }
  .diag-body { padding: 32px 20px 60px; }
  .grid-2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- TELA SELEÇÃO -->
<div id="tela-selecao">
  <div class="logo-bar">
    <div class="logo-dot"></div>
    <span class="logo-txt">Diagnóstico R.A.I.Z · Dra. Luana Rodrigues</span>
  </div>

  <div class="sel-titulo">Selecione a <span>lead</span></div>
  <p class="sel-sub">Conectado à sua planilha. Escolha a lead e gere o diagnóstico para a call.</p>

  <div class="campo-label">Leads disponíveis</div>
  <button class="btn-carregar" onclick="carregarLeads()">↓ Carregar leads da planilha</button>

  <div id="lead-selecionada-card" class="lead-selecionada-card">
    <div>
      <div class="lsc-nome" id="lsc-nome"></div>
      <div class="lsc-detalhe" id="lsc-detalhe"></div>
    </div>
    <button class="lsc-trocar" onclick="trocarLead()">Trocar</button>
  </div>

  <div id="campo-busca-wrap" class="campo-busca" style="display:none">
    <input type="text" id="busca-input" placeholder="Digite o nome da lead…" oninput="filtrarLeads()" autocomplete="off">
  </div>
  <div id="lista-leads" class="lista-leads"></div>

  <button class="btn-gerar" id="btn-gerar" onclick="gerarDiagnostico()">
    Gerar Diagnóstico R.A.I.Z →
  </button>
  <div class="status-txt" id="status-txt"></div>
</div>

<!-- TELA LOADING -->
<div id="tela-loading">
  <div class="spinner"></div>
  <div class="loading-nome" id="loading-nome"></div>
  <div class="loading-msg" id="loading-msg">Lendo o sistema completo da lead…</div>
</div>

<!-- TELA DIAGNÓSTICO -->
<div id="tela-diagnostico">
  <div class="diag-header">
    <div class="diag-header-esq">
      <span class="diag-badge">Diagnóstico R.A.I.Z</span>
      <div>
        <div class="diag-nome-header" id="h-nome"></div>
        <div class="diag-prof-header" id="h-prof"></div>
      </div>
    </div>
    <div>
      <button class="btn-nova" onclick="voltarSelecao()">← Nova lead</button>
      <button class="btn-imprimir" onclick="window.print()">Imprimir / PDF</button>
    </div>
  </div>
  <div class="diag-body" id="diag-conteudo"></div>
</div>

<script>
// ── CONFIGURAÇÃO ──
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyJY9j-EywuQq4ho15WJrqDcO85Eyol6SdKUE26HP2Wb6hMHElsNiyDDoPKkEDCfFKB/exec";

let todasLeads = [];
let leadSelecionada = null;

// ── CARREGAR LEADS DA PLANILHA ──
async function carregarLeads() {
  setStatus("Conectando à planilha…");
  document.querySelector('.btn-carregar').disabled = true;

  try {
    const resp = await fetch(ENDPOINT);
    if (!resp.ok) throw new Error("Erro ao conectar ao Apps Script. Status: " + resp.status);
    const linhas = await resp.json();

    if (!Array.isArray(linhas) || linhas.length === 0) {
      setStatus("Nenhuma resposta encontrada na planilha ainda.");
      document.querySelector('.btn-carregar').disabled = false;
      return;
    }

    todasLeads = linhas.map(function(l, i) {
      return Object.assign({ index: i }, l);
    }).reverse(); // mais recentes primeiro

    document.querySelector('.btn-carregar').style.display = 'none';
    document.getElementById('campo-busca-wrap').style.display = 'block';
    document.getElementById('busca-input').focus();
    renderLista(todasLeads);
    setStatus(todasLeads.length + " leads carregadas.");

  } catch(err) {
    setStatus("Erro: " + err.message);
    document.querySelector('.btn-carregar').disabled = false;
  }
}

// ── RENDERIZAR LISTA ──
function renderLista(leads) {
  const el = document.getElementById('lista-leads');
  if (!leads.length) {
    el.style.display = 'block';
    el.innerHTML = '<div style="padding:16px 18px;font-size:13px;color:var(--cinza)">Nenhuma lead encontrada.</div>';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = leads.map(l => {
    const score = parseInt(l.comprometimento) || 7;
    const cls = score >= 8 ? 'score-quente' : score >= 5 ? 'score-morna' : 'score-fria';
    const label = score >= 8 ? '🔥 ' + score + '/10' : score >= 5 ? '⚡ ' + score + '/10' : '🌱 ' + score + '/10';
    return `<div class="lead-item" onclick="selecionarLead(${l.index})">
      <span class="lead-item-score ${cls}">${label}</span>
      <div class="lead-item-nome">${l.nome}</div>
      <div class="lead-item-detalhe">${l.profissao}${l.idade ? ' · ' + l.idade + ' anos' : ''}${l.timestamp ? ' · ' + l.timestamp.substring(0,10) : ''}</div>
    </div>`;
  }).join('');
}

// ── FILTRAR ──
function filtrarLeads() {
  const q = document.getElementById('busca-input').value.toLowerCase();
  const filtradas = todasLeads.filter(l => l.nome.toLowerCase().includes(q) || l.profissao.toLowerCase().includes(q));
  renderLista(filtradas);
}

// ── SELECIONAR LEAD ──
function selecionarLead(index) {
  leadSelecionada = todasLeads.find(l => l.index === index);
  document.getElementById('lista-leads').style.display = 'none';
  document.getElementById('campo-busca-wrap').style.display = 'none';

  document.getElementById('lsc-nome').textContent = leadSelecionada.nome;
  document.getElementById('lsc-detalhe').textContent =
    (leadSelecionada.profissao || '') + (leadSelecionada.idade ? ' · ' + leadSelecionada.idade + ' anos' : '') +
    (leadSelecionada.timestamp ? ' · ' + leadSelecionada.timestamp.substring(0,10) : '');

  const card = document.getElementById('lead-selecionada-card');
  card.style.display = 'flex';
  document.getElementById('btn-gerar').style.display = 'block';
  setStatus('');
}

function trocarLead() {
  leadSelecionada = null;
  document.getElementById('lead-selecionada-card').style.display = 'none';
  document.getElementById('btn-gerar').style.display = 'none';
  document.getElementById('campo-busca-wrap').style.display = 'block';
  document.getElementById('busca-input').value = '';
  renderLista(todasLeads);
  document.getElementById('busca-input').focus();
}

// ── GERAR DIAGNÓSTICO ──
async function gerarDiagnostico() {
  if (!leadSelecionada) return;

  document.getElementById('tela-selecao').style.display = 'none';
  document.getElementById('tela-loading').style.display = 'flex';
  document.getElementById('loading-nome').textContent = leadSelecionada.nome;

  const msgs = [
    "Lendo o sistema completo da lead…",
    "Mapeando eixos de desregulação…",
    "Identificando raiz do desgaste…",
    "Construindo movimentos prioritários…",
    "Finalizando diagnóstico…"
  ];
  let mi = 0;
  const interval = setInterval(() => {
    document.getElementById('loading-msg').textContent = msgs[mi % msgs.length];
    mi++;
  }, 2000);

  try {
    const d = leadSelecionada;

    // Sanitiza campos — remove caracteres que quebram JSON
    function s(v) {
      return String(v || "")
        .replace(/\\/g, " ")
        .replace(/"/g, "'")
        .replace(/[\r\n]+/g, " ")
        .replace(/[\u0000-\u001F]/g, " ")
        .trim();
    }

    const prompt = "Voce e um sistema de analise clinica integrativa. Retorne SOMENTE JSON. Nenhuma palavra fora do JSON.\n\n" +
      "Contexto: Dra. Luana Rodrigues, especialista em Saude Integrativa e Neuroperformance, metodo R.A.I.Z. Call de vendas — entregar o QUE sem o COMO, gerar desejo pela Mentoria R.A.I.Z R$ 6.000.\n\n" +
      "DADOS:\n" +
      "Nome: " + s(d.nome) + "\n" +
      "Profissao: " + s(d.profissao) + "\n" +
      "Idade: " + s(d.idade) + "\n" +
      "Filhos: " + s(d.filhos) + "\n" +
      "Estado atual: " + s(d.estado_atual) + "\n" +
      "Sintomas: " + s(d.sintomas) + "\n" +
      "Dor principal: " + s(d.dor_principal) + "\n" +
      "Drenagem: " + s(d.drenagem) + "\n" +
      "Tentativas: " + s(d.tentativas) + "\n" +
      "Nao resolve sozinha: " + s(d.nao_resolvido) + "\n" +
      "Tempo: " + s(d.tempo_sintoma) + "\n" +
      "Custo: " + s(d.custo) + "\n" +
      "Paraiso: " + s(d.paraiso) + "\n" +
      "Medo: " + s(d.medo) + "\n" +
      "Investimento: " + s(d.investimento) + "\n" +
      "Comprometimento: " + s(d.comprometimento) + "/10\n" +
      "Observacao: " + s(d.observacao) + "\n\n" +
      "RETORNE APENAS ESTE JSON PREENCHIDO:\n" +
      '{"frase_abertura":"","eixos_desregulacao":[{"nome":"","descricao":""},{"nome":"","descricao":""},{"nome":"","descricao":""}],"o_que_esta_na_raiz":"","o_que_mantem_o_ciclo":"","movimentos_prioritarios":["","","",""],"frase_transicao":"","objecao_provavel":{"frase":"","quebra":""},"score_fechamento":' + (parseInt(d.comprometimento) || 7) + ',"leitura_prontidao":""}';

    const resp = await fetch(ENDPOINT, {
      method: "POST",
      body: JSON.stringify({ prompt: prompt })
    });

    clearInterval(interval);
    const texto = await resp.text();
    const match = texto.match(/\{[\s\S]*\}/);
    if (!match) throw new Error("Resposta invalida: " + texto.substring(0, 150));
    const diag = JSON.parse(match[0]);
    if (diag.erro) throw new Error(diag.erro);
    renderDiagnostico(d, diag);

  } catch(err) {
    clearInterval(interval);
    document.getElementById('tela-loading').style.display = 'none';
    document.getElementById('tela-selecao').style.display = 'block';
    setStatus("Erro: " + err.message);
  }
}

// ── RENDERIZAR DIAGNÓSTICO ──
function renderDiagnostico(d, diag) {
  document.getElementById('tela-loading').style.display = 'none';
  document.getElementById('tela-diagnostico').style.display = 'block';

  document.getElementById('h-nome').textContent = d.nome;
  document.getElementById('h-prof').textContent = d.profissao + (d.idade ? ' · ' + d.idade + ' anos' : '');

  const score = diag.score_fechamento || 7;
  const scorePct = (score / 10) * 100;
  const scoreLabel = score >= 8 ? '🔥 Lead quente — pronta para fechar' : score >= 5 ? '⚡ Lead morna — conduzir com perguntas' : '🌱 Lead fria — aprofundar dor antes de oferecer';
  const scoreCls = score >= 8 ? 'background:rgba(196,118,58,0.15);color:#C4763A' : score >= 5 ? 'background:rgba(156,123,94,0.12);color:#9C7B5E' : 'background:rgba(140,136,128,0.1);color:#8C8880';

  const eixosHTML = (diag.eixos_desregulacao || []).map((e, i) =>
    `<div class="eixo-item">
      <div class="eixo-num">${i+1}</div>
      <div><div class="eixo-nome">${e.nome}</div><div class="eixo-desc">${e.descricao}</div></div>
    </div>`
  ).join('');

  const movsHTML = (diag.movimentos_prioritarios || []).map((m, i) =>
    `<div class="mov-item"><span class="mov-num">0${i+1}</span><span class="mov-texto">${m}</span></div>`
  ).join('');

  const obFrase = diag.objecao_provavel?.frase || '';
  const obQuebra = diag.objecao_provavel?.quebra || '';

  document.getElementById('diag-conteudo').innerHTML = `
    <div class="abertura-bloco">
      <div class="overline">Diagnóstico Pré-Call · ${new Date().toLocaleDateString('pt-BR')}</div>
      <div class="titulo-lead">${d.nome}</div>
      <div class="subtitulo-lead">${d.profissao}${d.idade ? ' · ' + d.idade + ' anos' : ''}${d.filhos ? ' · ' + d.filhos : ''}</div>
      <div class="frase-abertura">${diag.frase_abertura}</div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-label">Eixos de Desregulação</div>
        ${eixosHTML}
      </div>
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="card" style="flex:1">
          <div class="card-label">O que está na Raiz</div>
          <div class="card-texto">${diag.o_que_esta_na_raiz}</div>
        </div>
        <div class="card" style="flex:1">
          <div class="card-label">O que Mantém o Ciclo</div>
          <div class="card-texto">${diag.o_que_mantem_o_ciclo}</div>
        </div>
      </div>
    </div>

    <div class="grid-full card">
      <div class="card-label">Movimentos Prioritários — O Quê (sem o Como)</div>
      ${movsHTML}
      <div class="transicao-bloco">
        <div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cobre);margin-bottom:8px">Frase de Transição para a Oferta</div>
        <div class="transicao-texto">${diag.frase_transicao}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-label">Score de Fechamento</div>
        <div class="score-wrap">
          <div class="score-track"><div class="score-fill" id="score-fill" style="width:0%"></div></div>
          <span class="score-num">${score}</span>
        </div>
        <div class="score-legenda">${diag.leitura_prontidao}</div>
        <div class="score-pill" style="${scoreCls}">${scoreLabel}</div>
      </div>
      <div class="card">
        <div class="card-label">Objeção Provável & Como Quebrar</div>
        <div class="obj-tag">Ela pode dizer</div>
        <div class="obj-frase">"${obFrase}"</div>
        <div class="obj-quebra">${obQuebra}</div>
      </div>
    </div>

    <div class="rodape">
      <div class="rodape-marca">Método <span>R.A.I.Z</span> · Dra. Luana Rodrigues</div>
      <div class="rodape-data">Gerado em ${new Date().toLocaleDateString('pt-BR')}</div>
    </div>
  `;

  setTimeout(() => {
    const fill = document.getElementById('score-fill');
    if (fill) fill.style.width = scorePct + '%';
  }, 100);

  window.scrollTo({ top: 0 });
}

function voltarSelecao() {
  document.getElementById('tela-diagnostico').style.display = 'none';
  document.getElementById('tela-selecao').style.display = 'block';
}

function setStatus(msg) {
  document.getElementById('status-txt').textContent = msg;
}
</script>
</body>
</html>
